name: release

# Push to main -> run the tests -> publish a release.
#
# The release job only runs when every test leg is green, and the version is cut
# automatically at the MINOR position (v0.2.0 -> v0.3.0, patch reset to 0).
# See scripts/release_version.py and scripts/release_notes.py.
#
# Guarantees:
#   * tests gate the release - a red suite means no tag, no release, no notes
#   * one release per commit - a commit that already carries a v* tag yields SKIP,
#     so a re-run or duplicate delivery is a no-op, never a second release
#   * serialised - concurrent pushes queue instead of racing for the same tag
#   * self-testing - the version, note and push-gate rules are proven before tagging
#
# CI uses macos-26, whose default Xcode is 26.6 (17F113) - the same build the app is
# developed against locally, so this is the real toolchain and not a stand-in.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: test (${{ matrix.name }})
    runs-on: macos-26
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ios-simulator
          - name: catalyst
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Prove the gate scripts
        run: |
          python3 scripts/release_version.py --self-test
          python3 scripts/release_notes.py --self-test
          python3 scripts/ci_simulator.py --self-test
          python3 scripts/verify-pushed.py --self-test

      - name: Resolve packages
        run: xcodebuild -resolvePackageDependencies -project Mattermost.xcodeproj -scheme Mattermost

      - name: Unit tests
        run: |
          set -euo pipefail
          if [ "${{ matrix.name }}" = "ios-simulator" ]; then
            # Resolve the destination from the image, because runner images rename
            # simulators between OS releases and a hard-coded name rots.
            DEST="id=$(python3 scripts/ci_simulator.py)"
            echo "ios destination: $DEST"
          else
            DEST="platform=macOS,variant=Mac Catalyst"
            echo "catalyst destination: $DEST"
          fi

          LOG="$RUNNER_TEMP/${{ matrix.name }}.log"
          # Signing flags differ by leg, and this is load-bearing:
          #   Catalyst - the macOS Keychain does not demand an application-identifier,
          #              so signing can be switched off entirely.
          #   iOS Simulator - switching signing off strips the entitlements blob, the
          #              app gets no application-identifier, and every Keychain call
          #              fails with -34018 (errSecMissingEntitlement). Ad-hoc signing
          #              keeps the entitlements and needs no certificate or team.
          if [ "${{ matrix.name }}" = "catalyst" ]; then
            SIGN="CODE_SIGNING_ALLOWED=NO"
          else
            SIGN="CODE_SIGNING_ALLOWED=YES CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=-"
          fi
          echo "signing: $SIGN"

          set +e
          # shellcheck disable=SC2086  # SIGN is a deliberate word-split flag list
          xcodebuild test \
            -project Mattermost.xcodeproj \
            -scheme Mattermost \
            -destination "$DEST" \
            -skip-testing:MattermostUITests \
            -derivedDataPath "$RUNNER_TEMP/dd" \
            -test-timeouts-enabled YES \
            -default-test-execution-time-allowance 300 \
            $SIGN \
            > "$LOG" 2>&1
          RC=$?
          set -e

          tail -60 "$LOG"
          echo "xcodebuild exit: $RC"
          if ! grep -qE "\*\* TEST SUCCEEDED \*\*" "$LOG"; then
            echo "::error::TEST SUCCEEDED not found in the ${{ matrix.name }} log"
            grep -E "error:|failed|FAIL" "$LOG" | head -40 || true
            exit 1
          fi
          # Print xcodebuild's own summary rather than a hand-rolled count: a counter
          # built on a grep pattern can match its own echoed command line in the log,
          # which is how a green suite once reported "failures reported: 1".
          echo "--- result summary ---"
          grep -E "Executed [0-9]+ tests" "$LOG" | tail -3 || true
          grep -E "^\*\* TEST" "$LOG" | tail -1 || true

      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-log-${{ matrix.name }}
          path: ${{ runner.temp }}/${{ matrix.name }}.log
          if-no-files-found: warn

  release:
    name: tag and publish
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Prove the rules on the tagging host
        run: |
          python3 scripts/release_version.py --self-test
          python3 scripts/release_notes.py --self-test

      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          git fetch --tags --force --quiet
          SHA=$(git rev-parse HEAD)
          SHORT=$(git rev-parse --short=8 HEAD)

          # Only the tip of main may cut a release. Runs queue behind each other, so a
          # superseded run can start after a newer one has already released; without
          # this guard it would compute the next version and attach it to an OLDER
          # commit, putting the ladder out of order (v0.6.0 on a commit below v0.5.0).
          TIP=$(git ls-remote origin refs/heads/main | cut -f1)
          if [ "$TIP" != "$SHA" ]; then
            echo "$SHORT is not the tip of main (${TIP:0:8}); superseded, no release cut."
            exit 0
          fi

          # Tags are created through the Releases API (gh release create --target),
          # NOT with `git tag` + `git push`. Reason, learned the hard way on run
          # 40332873749: a workflow's own token is a GitHub App, and GitHub refuses to
          # let an App push any ref whose history contains a change to a workflow file:
          #   ! [remote rejected] v0.5.0 (refusing to allow a GitHub App to create or
          #     update workflow `.github/workflows/release.yml` without `workflows` permission)
          # The App cannot be granted that permission, so the git-push route can never be
          # reliable here. The Releases API is not subject to that check.

          TAG=$(python3 scripts/release_version.py --format tag --dry-run)

          if [ "$TAG" = "SKIP" ]; then
            # SKIP now means the REMOTE already carries a release tag on this commit,
            # because the runner is fresh and never invents a local tag.
            EXISTING=$(git tag --points-at HEAD | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1)
            if [ -z "$EXISTING" ]; then
              echo "::error::SKIP with no release tag on HEAD $SHORT"
              exit 1
            fi
            if gh release view "$EXISTING" --repo "$REPO" >/dev/null 2>&1; then
              echo "already published: $EXISTING at $SHORT - nothing to do"
              exit 0
            fi
            # A tag without a release is an incomplete earlier attempt: finish it.
            echo "tag $EXISTING exists but has no release; completing it"
            TAG="$EXISTING"
            TARGET_ARGS="--verify-tag"
            PREV=$(git describe --tags --abbrev=0 "$SHA^" 2>/dev/null || echo "")
          else
            TARGET_ARGS="--target $SHA"
            PREV=$(git describe --tags --abbrev=0 "$SHA^" 2>/dev/null || echo "")
          fi

          # Notes come from commit subjects plus any PR references inside them, so this
          # works whether commits arrive directly or through pull requests.
          if [ -n "$PREV" ]; then
            python3 scripts/release_notes.py --from "$PREV" --to "$SHA" --repo "$REPO" > /tmp/notes.md || true
          else
            python3 scripts/release_notes.py --to "$SHA" --repo "$REPO" > /tmp/notes.md || true
          fi
          [ -s /tmp/notes.md ] || echo "Release $TAG at $SHA." > /tmp/notes.md
          {
            echo ""
            echo "**Verified** on Xcode 26.6 (17F113): unit suites green on iOS Simulator and Mac Catalyst."
            echo "**Full Changelog**: https://github.com/${REPO}/compare/${PREV:-root}...$TAG"
          } >> /tmp/notes.md

          # shellcheck disable=SC2086  # TARGET_ARGS is a deliberate word-split flag list
          gh release create "$TAG" $TARGET_ARGS \
            --title "$TAG" \
            --notes-file /tmp/notes.md \
            --latest \
            --repo "$REPO" || {
              # A concurrent run may have won the race; that is success, not failure.
              if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
                echo "release $TAG already exists (concurrent run won); treating as success"
                exit 0
              fi
              echo "::error::could not create release $TAG"
              exit 1
            }

          # Verify the side effect instead of trusting the command's exit code.
          gh release view "$TAG" --repo "$REPO" --json tagName,isDraft,url \
            --jq '"published \(.tagName) -> \(.url)"'
          echo "RELEASE CREATED: $TAG at $SHORT"
