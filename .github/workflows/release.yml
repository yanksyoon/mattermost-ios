name: release

# Push to main -> run the tests -> publish a release.
#
# The release job only runs when every test leg is green, and the version moves by the
# position the commit history earns (Conventional Commits): a `feat:` in the push is a
# MINOR bump, anything else - `fix:`, `docs:`, `test:`, `chore:`, a merge - is a PATCH
# bump. Every push still publishes. See scripts/release_version.py and
# scripts/release_notes.py, and docs/releasing.md for the trade-off.
#
# Guarantees:
#   * tests gate the release - a red suite means no tag, no release, no notes
#   * one release per commit - a commit that already carries a v* tag yields SKIP,
#     so a re-run or duplicate delivery is a no-op, never a second release
#   * serialised - concurrent pushes queue instead of racing for the same tag
#   * self-testing - the version, note and push-gate rules are proven before tagging
#   * every skip says why - the guard, the release job and the closing `verdict` job
#     write the reason to the run page as an annotation and a summary line, so nobody
#     has to read a red X and guess (t_6904c92b)
#
# CI uses macos-26, whose default Xcode is 26.6 (17F113) - the same build the app is
# developed against locally, so this is the real toolchain and not a stand-in.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      # Proves the gate pass's hang sample reaches the run's artifact (t_a4e133f6).
      # Sets TEST_RUNNER_MATTERMOST_GATE_HANG_FIXTURE=1, which makes TGateHangFixtureTests block
      # past the execution-time allowance on purpose: both test legs go red, and
      # `test-xcresult-<leg>` must hold `gate-<leg>.xcresult` with a hang diagnostic in it.
      # Never set on a push - a run that uses it is red by design and publishes nothing. See
      # docs/releasing.md "Where a hung gate's stack lives: one result bundle per pass" and
      # docs/t_a4e133f6-build-note.md.
      self_test_gate_hang:
        description: "Deliberate gate hang: prove the gate result bundle reaches the artifact (reds both legs)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Cheap gate, on Linux, in seconds — see docs/releasing.md "Stage 0".
  #
  # Before this job existed the tip check lived inside the *release* job, so a push that
  # was already superseded still ran both macOS test legs and the package build before
  # discovering it had nothing to do (run 40339556034 burned ~8 macOS minutes and was
  # cancelled by hand; run 40341709601 never started at all). A cancelled run renders
  # red, which is how a working pipeline came to look broken (gap G1, card t_4ae44452).
  #
  # The decision itself lives in scripts/ci_plan.py so it can be tested; this job only
  # gathers the three facts. It also carries the docs-only policy (gap G2): a push whose
  # every changed path is documentation skips the test legs but still gets its release
  # and its downloadable app, because the owner asked for a release per push.
  guard:
    name: guard (tip + change scope)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      is_tip: ${{ steps.plan.outputs.is_tip }}
      docs_only: ${{ steps.plan.outputs.docs_only }}
      run_tests: ${{ steps.plan.outputs.run_tests }}
      reason: ${{ steps.plan.outputs.reason }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # the changed-file range needs the pushed-from commit

      - name: Prove the decision logic
        run: python3 scripts/ci_plan.py --self-test

      - name: Decide whether this push is worth macOS minutes
        id: plan
        env:
          BASE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          HEAD_SHA=$(git rev-parse HEAD)
          # A tip check that cannot reach the remote must fail this job: "I cannot tell"
          # is never "yes, run" (and never "nothing to do" either).
          TIP=$(git ls-remote origin refs/heads/main | cut -f1)
          CHANGED=$(mktemp)
          if [ -n "${BASE:-}" ] \
             && [ "${BASE}" != "0000000000000000000000000000000000000000" ] \
             && git cat-file -e "${BASE}^{commit}" 2>/dev/null; then
            git diff --name-only "$BASE" "$HEAD_SHA" > "$CHANGED" || : > "$CHANGED"
          else
            # No usable event.before (dispatch, force-push, first push): fall back to the
            # commit's own diff, and let ci_plan.py answer "test everything" if that is
            # empty too.
            git diff --name-only "$HEAD_SHA^" "$HEAD_SHA" > "$CHANGED" 2>/dev/null || : > "$CHANGED"
          fi
          echo "changed files:"; sed 's/^/  /' "$CHANGED"
          python3 scripts/ci_plan.py --head "$HEAD_SHA" --tip "$TIP" \
            --changed-files "$CHANGED" --format github-env \
            --summary-file "$GITHUB_STEP_SUMMARY" | tee -a "$GITHUB_OUTPUT"

      # The decision is written on the run itself, not only in a job log a reader has to
      # open: an annotation is the sentence that shows on the run page, and the summary
      # is what the run's "Summary" tab shows first (t_6904c92b).
      - name: Say the decision on the run
        if: always()
        env:
          IS_TIP: ${{ steps.plan.outputs.is_tip }}
          RUN_TESTS: ${{ steps.plan.outputs.run_tests }}
          DOCS_ONLY: ${{ steps.plan.outputs.docs_only }}
          REASON: ${{ steps.plan.outputs.reason }}
        run: |
          set -euo pipefail
          SUMMARY="${GITHUB_STEP_SUMMARY:-/dev/null}"
          if [ -z "${REASON:-}" ]; then
            echo "::error::the guard produced no decision - refusing to guess (ls-remote or ci_plan failed above)"
            { echo ""; echo "**guard:** no decision - the pipeline is blocked before any macOS minutes."; } >> "$SUMMARY"
            exit 1
          fi
          if [ "$IS_TIP" = "true" ] && [ "$RUN_TESTS" = "true" ]; then
            LINE="tests run, then release, then package - ${REASON}"
            echo "::notice::guard: ${LINE}"
          elif [ "$IS_TIP" = "true" ]; then
            LINE="test legs skipped by policy (${REASON}); the release and the package job still run"
            echo "::notice::guard: ${LINE}"
          else
            LINE="SKIP: this push is superseded (${REASON}); no macOS minutes spent, the tip run releases"
            echo "::notice::${LINE}"
          fi
          { echo ""; echo "**guard:** ${LINE}"; } >> "$SUMMARY"

  # Parity record — cheap, Linux, no network, no platform build. Report mode first (design
  # docs/parity-map-design.md §4.4): a mapping finding does not fail the build while the claims
  # are partial, but artifact drift does — `docs/PARITY.md` and `parity/out/*` are generated and a
  # hand edit is a red build. The differential and the mutation run are blocking on their own.
  parity:
    name: parity record (report mode)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # ancestry checks against the verdict ledger need the history

      - name: self-test (six faults + determinism)
        run: python3 parity/generate.py --self-test

      - name: differential (hand-authored expected table, whole input space)
        run: python3 scripts/differential.py

      - name: mutation (each detector blinded in isolation must be caught)
        run: python3 scripts/mutate-test.py

      - name: check (drift fails; findings report)
        run: python3 parity/generate.py --check --report

  test:
    name: test (${{ matrix.name }})
    needs: guard
    if: needs.guard.outputs.run_tests == 'true'
    runs-on: macos-26
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ios-simulator
          - name: catalyst
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Split the suite, not the standards. Three passes, because one class of failure makes
      # another unreadable (t_6904c92b, measured on the hosted runner):
      #
      #   * The platform-service tests below need something the hosted runner does not have:
      #     WebKit's WebContent/GPU XPC service (every launch is refused with
      #     "Could not signal service com.apple.WebKit.WebContent: 113"), and, on the
      #     simulator, a working pasteboard. Each attempt costs child processes; a full-suite
      #     run logs ~312 refused launches, and on a 3-vCPU runner that load starves the
      #     *timing* tests that follow it - T44C's own hang detector then fires at 150 s
      #     although the queue is fine.
      #   * So they run in their own pass (reported by name, listed on the run), and the
      #     main pass - the gate - runs everything else, where a hang is a real hang.
      #
      # Both passes run on every leg. The main pass must be fully green. The platform pass
      # fails the leg on an assertion, and is reported as "did not complete here" (a
      # warning that names the tests, echoed into the release body) when it hangs.
      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Prove the gate scripts
        run: |
          python3 scripts/release_version.py --self-test
          python3 scripts/release_notes.py --self-test
          python3 scripts/ci_simulator.py --self-test
          python3 scripts/verify-pushed.py --self-test
          # The guard's decision and the post-upload check: both are pure logic against
          # a stub, so they are proven on every source push rather than trusted.
          python3 scripts/ci_plan.py --self-test
          python3 scripts/verify_release_asset.py --self-test
          # Replays the shipped "Publish the release" step body against a throwaway
          # bare origin + stub gh: 8 scenarios plus the negative control (a4b6467's
          # body must reproduce the silent green). bash + git + python3 only.
          bash scripts/release_publish_selftest.sh
          # Replays the shipped tail of the "Unit tests" step against log fixtures: a red
          # leg must annotate the *name* of the failing test (t_f427b00b), and the pre-fix
          # fixed-sentence body must still reproduce the generic annotation.
          bash scripts/test_annotation_selftest.sh
          # The platform-service pass must tell a hang (the runner's WebKit/pasteboard never
          # answered, not a product statement) from an assertion (a product statement).
          bash scripts/classify_platform_tests.sh --self-test

      - name: Resolve packages
        run: xcodebuild -resolvePackageDependencies -project Mattermost.xcodeproj -scheme Mattermost

      - name: Unit tests
        env:
          # The gate's own hang sample, on demand (t_a4e133f6). "0" on every push, so
          # TGateHangFixtureTests skips and the gate stays a gate; a dispatch with
          # `self_test_gate_hang: true` makes that case block past the allowance on purpose,
          # so the leg goes red and `gate-<leg>.xcresult` has to carry the hang sample.
          #
          # `TEST_RUNNER_`-prefixed because that is the form xcodebuild forwards to a
          # simulator test runner (the prefix is stripped on the way); a Catalyst process
          # inherits it as it stands, and TGateHangFixtureTests reads both spellings.
          # `github.event.inputs`, not `inputs`: on a push both are unset, and this form is a
          # plain string comparison that reads false there.
          TEST_RUNNER_MATTERMOST_GATE_HANG_FIXTURE: ${{ github.event.inputs.self_test_gate_hang == 'true' && '1' || '0' }}
        run: |
          set -euo pipefail
          if [ "${{ matrix.name }}" = "ios-simulator" ]; then
            # Resolve the destination from the image, because runner images rename
            # simulators between OS releases and a hard-coded name rots.
            DEST="id=$(python3 scripts/ci_simulator.py)"
            echo "ios destination: $DEST"
          else
            DEST="platform=macOS,variant=Mac Catalyst"
            echo "catalyst destination: $DEST"
          fi

          LOG="$RUNNER_TEMP/${{ matrix.name }}.log"
          # Signing flags differ by leg, and this is load-bearing:
          #   Catalyst - the macOS Keychain does not demand an application-identifier,
          #              so signing can be switched off entirely.
          #   iOS Simulator - switching signing off strips the entitlements blob, the
          #              app gets no application-identifier, and every Keychain call
          #              fails with -34018 (errSecMissingEntitlement). Ad-hoc signing
          #              keeps the entitlements and needs no certificate or team.
          if [ "${{ matrix.name }}" = "catalyst" ]; then
            SIGN="CODE_SIGNING_ALLOWED=NO"
          else
            SIGN="CODE_SIGNING_ALLOWED=YES CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=-"
          fi
          echo "signing: $SIGN"

          # An explicit result bundle per pass, in its own directory (t_a4e133f6).
          #
          # All three passes used to share -derivedDataPath "$RUNNER_TEMP/dd" and let
          # xcodebuild name the bundle under dd/Logs/Test. That directory is not a record:
          # on run 43240373846 the gate pass hung and wrote
          # Test-Mattermost-2026.11.12_14-47-40-+0000.xcresult (the bundle that carries the
          # hang sample, named in the log), and by the time the upload step ran at 15:13 the
          # directory held only the timing and platform bundles - the gate's was gone, so
          # the one artifact that could name the wedged frame was never uploaded. Naming a
          # path per pass takes the retention rule out of the equation: nothing later can
          # reuse, overwrite or prune it. `rm -rf` first because xcodebuild refuses an
          # existing result-bundle path (a re-run in the same workspace would otherwise
          # fail the step before it compiles anything).
          RESULT="$RUNNER_TEMP/gate-${{ matrix.name }}.xcresult"
          rm -rf "$RESULT"

          set +e
          # The gate pass: everything except the platform-service classes, which need a
          # service this runner refuses (see the comment on this job). Kept as one literal
          # list so a reviewer can see exactly what is not in the gate.
          # shellcheck disable=SC2086  # SIGN and PLATFORM_SKIP are deliberate flag lists
          xcodebuild test \
            -project Mattermost.xcodeproj \
            -scheme Mattermost \
            -destination "$DEST" \
            -skip-testing:MattermostUITests \
            -skip-testing:MattermostTests/T31HarvestCookieInstallTests \
            -skip-testing:MattermostTests/T35PasteTests \
            -skip-testing:MattermostTests/T46WebFallbackTests \
            -skip-testing:MattermostTests/T56SelectionTests \
            -skip-testing:MattermostTests/T44CCallsMediaTeardownQueueTests \
            -skip-testing:MattermostTests/T49LoggerConcurrencyTests \
            -derivedDataPath "$RUNNER_TEMP/dd" \
            -resultBundlePath "$RESULT" \
            -test-timeouts-enabled YES \
            -default-test-execution-time-allowance 300 \
            -collect-test-diagnostics on-failure \
            $SIGN \
            > "$LOG" 2>&1
          RC=$?
          set -e

          tail -60 "$LOG"
          echo "xcodebuild exit: $RC"

          # One decision, one sentence. scripts/test_verdict.sh names the failing test on
          # the check-run annotation and classifies the red (assertion / hang / refused
          # WebKit environment). All three passes call it, so they cannot drift apart, and
          # scripts/test_annotation_selftest.sh replays it against log fixtures - including
          # one where WebKit noise and a real assertion appear in the same log (t_6904c92b).
          bash scripts/test_verdict.sh --log "$LOG" --leg "${{ matrix.name }}" --pass gate

      # The timing-sensitive classes, in their own process, and required.
      #
      # Measured, not assumed (card t_6904c92b, 2026-11-09):
      #   * run 42617348657, `probe (catalyst / logic)`: inside the full suite these two
      #     classes red at 150 s, 20 s and 60 s - `T44CCallsMediaTeardownQueueTests` never
      #     saw its first teardown block start, `T49LoggerConcurrencyTests` never saw its
      #     32 logging blocks finish. The blocks were queued; the process had no thread
      #     free to run them.
      #   * run 42614060467, `probe (isolated)`: the same three cases, same runner image,
      #     in their own process - 1.07 s, 2.02 s, 0.21 s, all green (xcodebuild exit 0).
      # So this is not a product hang and it is not a relaxed test: the same code, the same
      # detectors, a process that is not competing with ~2,400 other cases and WebKit's
      # refused child launches. A failure here is a RED LEG, exactly like the gate pass.
      - name: Timing-sensitive tests (own process, required)
        if: always()
        env:
          TIMING_ONLY: >-
            -only-testing:MattermostTests/T44CCallsMediaTeardownQueueTests
            -only-testing:MattermostTests/T49LoggerConcurrencyTests
        run: |
          set -euo pipefail
          if [ "${{ matrix.name }}" = "ios-simulator" ]; then
            DEST="id=$(python3 scripts/ci_simulator.py)"
            SIGN="CODE_SIGNING_ALLOWED=YES CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=-"
          else
            DEST="platform=macOS,variant=Mac Catalyst"
            SIGN="CODE_SIGNING_ALLOWED=NO"
          fi
          LOG="$RUNNER_TEMP/timing-${{ matrix.name }}.log"
          # Explicit bundle path - see the gate step's comment (t_a4e133f6).
          RESULT="$RUNNER_TEMP/timing-${{ matrix.name }}.xcresult"
          rm -rf "$RESULT"
          # shellcheck disable=SC2086  # SIGN and TIMING_ONLY are deliberate flag lists
          set +e
          xcodebuild test \
            -project Mattermost.xcodeproj \
            -scheme Mattermost \
            -destination "$DEST" \
            -derivedDataPath "$RUNNER_TEMP/dd" \
            -resultBundlePath "$RESULT" \
            -test-timeouts-enabled YES \
            -default-test-execution-time-allowance 300 \
            $SIGN $TIMING_ONLY \
            > "$LOG" 2>&1
          RC=$?
          set -e
          echo "xcodebuild exit: $RC"
          tail -40 "$LOG"
          bash scripts/test_verdict.sh --log "$LOG" --leg "${{ matrix.name }}" --pass timing

      # The second pass: the classes that need a platform service the hosted runner refuses.
      # An assertion here is a red leg. A hang here is reported by name - it is the runner's
      # WebKit/pasteboard that never answers - and is not certification of anything.
      - name: Platform-service tests (reported, not certified here)
        if: always()
        env:
          PLATFORM_ONLY: >-
            -only-testing:MattermostTests/T31HarvestCookieInstallTests
            -only-testing:MattermostTests/T35PasteTests
            -only-testing:MattermostTests/T46WebFallbackTests
            -only-testing:MattermostTests/T56SelectionTests
        run: |
          set -euo pipefail
          if [ "${{ matrix.name }}" = "ios-simulator" ]; then
            DEST="id=$(python3 scripts/ci_simulator.py)"
            SIGN="CODE_SIGNING_ALLOWED=YES CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=-"
          else
            DEST="platform=macOS,variant=Mac Catalyst"
            SIGN="CODE_SIGNING_ALLOWED=NO"
          fi
          LOG="$RUNNER_TEMP/platform-${{ matrix.name }}.log"
          # Explicit bundle path - see the gate step's comment (t_a4e133f6).
          RESULT="$RUNNER_TEMP/platform-${{ matrix.name }}.xcresult"
          rm -rf "$RESULT"
          set +e
          # shellcheck disable=SC2086  # SIGN and PLATFORM_ONLY are deliberate flag lists
          xcodebuild test \
            -project Mattermost.xcodeproj \
            -scheme Mattermost \
            -destination "$DEST" \
            -derivedDataPath "$RUNNER_TEMP/dd" \
            -resultBundlePath "$RESULT" \
            -test-timeouts-enabled YES \
            -default-test-execution-time-allowance 300 \
            $SIGN $PLATFORM_ONLY \
            > "$LOG" 2>&1
          RC=$?
          set -e
          echo "xcodebuild exit: $RC"
          SUMMARY="${GITHUB_STEP_SUMMARY:-/dev/null}"
          tail -40 "$LOG"

          # One place decides green / hung / asserted, and it has its own self-test - a hang
          # here certifies nothing but must not turn into a red leg either (see that script).
          set +e
          VERDICT=$(bash scripts/classify_platform_tests.sh "$LOG")
          VRC=$?
          set -e
          echo "verdict: $VERDICT (rc=$VRC)"
          case "$VERDICT" in
            green)
              {
                echo ""
                echo "### platform-service tests (${{ matrix.name }}): green"
                echo "- WebKit/pasteboard answered on this run: T31 harvest, T35 paste, T46 fallback, T56 selection all passed."
              } >> "$SUMMARY"
              exit 0 ;;
            "hung "*)
              HUNG="${VERDICT#hung }"
              echo "::warning::test (${{ matrix.name }}): platform-service tests did not complete on this runner - $HUNG hit the execution-time allowance. The runner's WebKit/pasteboard never answered. Not certified here, not a product failure; detail in the step log."
              {
                echo ""
                echo "### platform-service tests (${{ matrix.name }}): did not complete here"
                echo "- \`$HUNG\` hit the execution-time allowance: WebKit/pasteboard is unavailable on this runner."
                echo "- Not certified on this run. Covered by a local run on a Mac (§ Running locally) - see docs/releasing.md, \"WebKit in the test host\"."
              } >> "$SUMMARY"
              exit 0 ;;
            "asserted "*)
              ASSERTED="${VERDICT#asserted }"
              echo "::error::test (${{ matrix.name }}): platform-service tests asserted - $ASSERTED failed on its assertions, not on a hang. That is a product failure; fix it, do not re-file it as runner noise."
              exit 1 ;;
            *)
              echo "::error::test (${{ matrix.name }}): platform-service tests failed with no test name in the log"
              exit 1 ;;
          esac

      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-log-${{ matrix.name }}
          path: |
            ${{ runner.temp }}/${{ matrix.name }}.log
            ${{ runner.temp }}/timing-${{ matrix.name }}.log
            ${{ runner.temp }}/platform-${{ matrix.name }}.log
          if-no-files-found: warn

      # The result bundle is where xcodebuild puts the diagnostics it asks you to attach when a
      # test exceeds its execution allowance (t_d398053f §6): the stack/spindump of the wedged
      # process. Until this step existed the workflow threw it away, so nobody could name the
      # blocked frame. Uploaded on every run (a 300 s hang is only visible after the fact).
      #
      # One bundle per pass, at the explicit path each pass was given (t_a4e133f6). Before
      # that, all three passes let xcodebuild name the bundle under dd/Logs/Test and this step
      # globbed that directory - and on run 43240373846 the gate's bundle (the one holding the
      # hang sample) was already gone by upload time, so the artifact held only the two green
      # passes. A pass that never ran leaves no file, hence `if-no-files-found: warn`.
      - name: Upload test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-xcresult-${{ matrix.name }}
          path: |
            ${{ runner.temp }}/gate-${{ matrix.name }}.xcresult
            ${{ runner.temp }}/timing-${{ matrix.name }}.xcresult
            ${{ runner.temp }}/platform-${{ matrix.name }}.xcresult
            ${{ runner.temp }}/dd/Logs/Test/*.spindump
            ${{ runner.temp }}/dd/Logs/Test/*.sysdiagnose*
            ${{ runner.temp }}/dd/Logs/Test/*.log
          if-no-files-found: warn
          retention-days: 14

  release:
    name: tag and publish
    needs: [guard, test]
    # `always()` so a *skipped* test leg (docs-only push, gap G2) does not skip the
    # release: the owner asked for a release per push. A red test leg still blocks it,
    # and a superseded run is gated out here before it touches anything.
    if: >-
      always() && needs.guard.outputs.is_tip == 'true'
      && (needs.test.result == 'success' || needs.test.result == 'skipped')
    runs-on: ubuntu-latest
    # The package job builds an app only for a commit that actually has a release to
    # attach it to. `published=false` is the honest answer for a run that was the tip
    # when it started and was superseded before this job ran: instead of spending six
    # macOS minutes on a zip with nowhere to go, the package job is skipped.
    outputs:
      published: ${{ steps.publish.outputs.published }}
      reason: ${{ steps.publish.outputs.reason }}
      tag: ${{ steps.publish.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Prove the rules on the tagging host
        run: |
          python3 scripts/release_version.py --self-test
          python3 scripts/release_notes.py --self-test
          # The check the package job will run after it uploads, proven here too.
          python3 scripts/verify_release_asset.py --self-test
          # The step body below is replayed verbatim by the self-test, on this runner.
          bash scripts/release_publish_selftest.sh

      - name: Publish the release
        id: publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          # What actually happened on the gate, so the release body cannot claim "green"
          # for a push whose legs were skipped by the docs-only policy.
          TESTS: ${{ needs.test.result }}
        run: |
          set -euo pipefail
          # Default is "no release for this commit": every path that publishes overrides
          # it. A caller (the package job) reads this, so an unset output can never be
          # mistaken for a published release.
          echo "published=false" >> "${GITHUB_OUTPUT:-/dev/null}"
          echo "reason=none" >> "${GITHUB_OUTPUT:-/dev/null}"
          echo "tag=" >> "${GITHUB_OUTPUT:-/dev/null}"

          # Every path that does not publish says why, on the run itself: an annotation
          # for the run page and a line for the run's summary tab. A reader seeing a
          # skipped tag-and-publish must not have to open a job to learn the reason
          # (t_6904c92b). `$2` is the machine word the verdict job reads.
          skip() { # $1 = sentence, $2 = reason word
            echo "::notice::SKIP: $1"
            echo "reason=$2" >> "${GITHUB_OUTPUT:-/dev/null}"
            { echo ""; echo "**release:** SKIP - $1"; } >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
          }

          git fetch --tags --force --quiet
          SHA=$(git rev-parse HEAD)
          SHORT=$(git rev-parse --short=8 HEAD)

          # Only the tip of main may cut a release. Runs queue behind each other, so a
          # superseded run can start after a newer one has already released; without
          # this guard it would compute the next version and attach it to an OLDER
          # commit, putting the ladder out of order (v0.6.0 on a commit below v0.5.0).
          TIP=$(git ls-remote origin refs/heads/main | cut -f1)
          if [ "$TIP" != "$SHA" ]; then
            skip "$SHORT is not the tip of main (${TIP:0:8}); superseded, no release cut." superseded
            exit 0
          fi

          # Tags are created through the Releases API (gh release create --target),
          # NOT with `git tag` + `git push`. Reason, learned the hard way on run
          # 40332873749: a workflow's own token is a GitHub App, and GitHub refuses to
          # let an App push any ref whose history contains a change to a workflow file:
          #   ! [remote rejected] v0.5.0 (refusing to allow a GitHub App to create or
          #     update workflow `.github/workflows/release.yml` without `workflows` permission)
          # The App cannot be granted that permission, so the git-push route can never be
          # reliable here. The Releases API is not subject to that check.

          TAG=$(python3 scripts/release_version.py --format tag --dry-run)

          if [ "$TAG" = "SKIP" ]; then
            # SKIP means this commit already carries a v* tag. The runner is fresh, so it
            # cannot be a tag this step made itself (the retry loop removed in 1e64fbf
            # could read its own): either the release exists - a re-run, exit 0 - or a
            # tag landed without its release, which the step finishes.
            #
            # `|| true` is load-bearing. Under `set -e` + `pipefail` an assignment dies
            # when its pipeline fails, so a bare-tag scan that matched nothing used to
            # kill the step BEFORE the ::error:: below could print: a red job with no
            # reason in the log. A pre-release tag is exactly that case - v0.5.0-rc1 is
            # accepted by release_version.py's parse_tag (suffix dropped, so SKIP) but is
            # not a release tag. Policy, also stated in docs/releasing.md: a pre-release
            # tag is not a release; the step refuses loudly and cuts nothing.
            #
            # `--sort=-v:refname` is git's own version sort (0.10 > 0.9) so the same body
            # runs on a runner without GNU coreutils; scripts/release_publish_selftest.sh
            # replays this text on the macOS leg.
            EXISTING=$(git tag --points-at HEAD --sort=-v:refname \
              | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -1 || true)
            if [ -z "$EXISTING" ]; then
              echo "::error::SKIP with no release tag on HEAD $SHORT (a non-release tag, such as a pre-release suffix, is on HEAD; nothing cut - delete the tag or push a new commit)"
              echo "reason=non-release-tag" >> "${GITHUB_OUTPUT:-/dev/null}"
              { echo ""; echo "**release:** REFUSED - only a non-release tag (a pre-release suffix) is on HEAD; nothing cut."; } >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
              exit 1
            fi
            if gh release view "$EXISTING" --repo "$REPO" >/dev/null 2>&1; then
              skip "already published: $EXISTING at $SHORT - nothing to do (re-run or duplicate delivery of a commit that already has its release)" already-published
              echo "published=true" >> "${GITHUB_OUTPUT:-/dev/null}"
              exit 0
            fi
            # A tag without a release is an incomplete earlier attempt: finish it.
            echo "tag $EXISTING exists but has no release; completing it"
            TAG="$EXISTING"
            TARGET_ARGS="--verify-tag"
            PREV=$(git describe --tags --abbrev=0 "$SHA^" 2>/dev/null || echo "")
          else
            TARGET_ARGS="--target $SHA"
            PREV=$(git describe --tags --abbrev=0 "$SHA^" 2>/dev/null || echo "")
          fi

          # The tag is now decided (new, or an existing tag whose release is incomplete).
          echo "tag=$TAG" >> "${GITHUB_OUTPUT:-/dev/null}"

          # Notes come from commit subjects plus any PR references inside them, so this
          # works whether commits arrive directly or through pull requests.
          if [ -n "$PREV" ]; then
            python3 scripts/release_notes.py --from "$PREV" --to "$SHA" --repo "$REPO" > /tmp/notes.md || true
          else
            python3 scripts/release_notes.py --to "$SHA" --repo "$REPO" > /tmp/notes.md || true
          fi
          [ -s /tmp/notes.md ] || echo "Release $TAG at $SHA." > /tmp/notes.md
          ASSET="Mattermost-macOS-${TAG}.zip"
          {
            echo ""
            # Say what actually ran. A docs-only push skips both test legs by policy
            # (gap G2), and a release body that claimed "suites green" for it would be a
            # claim nobody made (t_6904c92b).
            if [ "${TESTS:-}" = "skipped" ]; then
              echo "**Tests:** skipped for this push - documentation only (policy in docs/releasing.md)."
            elif [ "${TESTS:-}" = "success" ]; then
              echo "**Verified** on Xcode 26.6 (17F113): gate suites green on iOS Simulator and Mac Catalyst."
              # The four platform-service classes are reported, not certified, on the hosted
              # runner (WebKit/pasteboard are refused there). Say so in every release body
              # rather than let a green run imply coverage it did not have (t_6904c92b).
              echo "**Not certified here:** T31 harvest, T35 paste, T46 web-fallback and T56 selection (they need WebKit/pasteboard, which the runner refuses) - detail on the run, policy in docs/releasing.md."
            else
              echo "**Tests:** see the workflow run for this commit."
            fi
            echo "**Full Changelog**: https://github.com/${REPO}/compare/${PREV:-root}...$TAG"
            echo ""
            echo "### Install (one line, macOS)"
            echo ""
            echo '```bash'
            echo "curl -fL -o /tmp/mm.zip https://github.com/${REPO}/releases/download/${TAG}/${ASSET} && rm -rf /tmp/mm-unz /Applications/Mattermost.app && ditto -x -k /tmp/mm.zip /tmp/mm-unz && xattr -dr com.apple.quarantine /tmp/mm-unz/Mattermost-macOS-${TAG}/Mattermost.app && cp -R /tmp/mm-unz/Mattermost-macOS-${TAG}/Mattermost.app /Applications/ && open /Applications/Mattermost.app"
            echo '```'
            echo ""
            echo "The app is ad-hoc signed, not notarized (\`codesign --force --deep -s -\`, no Apple Developer account), so the one line above clears the quarantine bit for you. Downloading it by hand instead needs the same step; see \`docs/installing.md\`."
          } >> /tmp/notes.md

          # shellcheck disable=SC2086  # TARGET_ARGS is a deliberate word-split flag list
          gh release create "$TAG" $TARGET_ARGS \
            --title "$TAG" \
            --notes-file /tmp/notes.md \
            --latest \
            --repo "$REPO" || {
              # A concurrent run may have won the race; that is success, not failure.
              if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
                echo "release $TAG already exists (concurrent run won); treating as success"
                echo "published=true" >> "${GITHUB_OUTPUT:-/dev/null}"
                exit 0
              fi
              echo "::error::could not create release $TAG"
              exit 1
            }

          # Verify the side effect instead of trusting the command's exit code.
          gh release view "$TAG" --repo "$REPO" --json tagName,isDraft,url \
            --jq '"published \(.tagName) -> \(.url)"'
          echo "published=true" >> "${GITHUB_OUTPUT:-/dev/null}"
          echo "reason=published" >> "${GITHUB_OUTPUT:-/dev/null}"
          { echo ""; echo "**release:** PUBLISHED \`$TAG\` at \`$SHORT\`"; } >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
          echo "RELEASE CREATED: $TAG at $SHORT"

  package:
    name: package Mattermost.app
    needs: [guard, test, release]
    # Build only for a commit that has a release to attach the app to. `published` is
    # false for a run that was the tip when it started but was superseded before the
    # release job ran, so the six macOS minutes are not spent on a zip with nowhere to
    # go — and the job can no longer be green having attached nothing.
    if: always() && needs.release.outputs.published == 'true'
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Toolchain
        run: xcodebuild -version

      - name: Resolve packages
        run: xcodebuild -resolvePackageDependencies -project Mattermost.xcodeproj -scheme Mattermost

      # A Mac Catalyst Release build: a real double-clickable .app for the Mac, which is
      # the only artifact that is installable without an Apple Developer account.
      # Ad-hoc signed (CODE_SIGN_IDENTITY=-) so entitlements survive without a
      # certificate; not notarized, so the first launch needs a Gatekeeper override,
      # which README.txt inside the zip spells out.
      - name: Build Mattermost.app
        run: |
          set -euo pipefail
          xcodebuild build \
            -project Mattermost.xcodeproj \
            -scheme Mattermost \
            -configuration Release \
            -destination 'platform=macOS,variant=Mac Catalyst' \
            -derivedDataPath "$RUNNER_TEMP/dd" \
            CODE_SIGN_IDENTITY=- \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=YES \
            ONLY_ACTIVE_ARCH=NO \
            > "$RUNNER_TEMP/build.log" 2>&1 || {
              echo "::error::Release build failed"
              tail -80 "$RUNNER_TEMP/build.log"
              exit 1
            }
          tail -5 "$RUNNER_TEMP/build.log"

      - name: Verify and package
        run: |
          set -euo pipefail
          APP=$(find "$RUNNER_TEMP/dd/Build/Products" -maxdepth 2 -name 'Mattermost.app' -type d | head -1)
          [ -n "$APP" ] || { echo "::error::Mattermost.app not found in build products"; exit 1; }
          echo "app: $APP"

          BIN="$APP/Contents/MacOS/Mattermost"

          # The bundle's version comes from a static Info.plist that nobody bumps, so a
          # download would report "0.1.4" no matter which release it came from. Stamp
          # the tag in, then re-sign: editing the plist breaks the existing seal.
          TAG=$(git describe --tags --exact-match HEAD 2>/dev/null || echo "")
          [ -n "$TAG" ] || TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "0.0.0")
          SHORT_VERSION="${TAG#v}"
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $SHORT_VERSION" "$APP/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${GITHUB_RUN_NUMBER}" "$APP/Contents/Info.plist" 2>/dev/null \
            || /usr/libexec/PlistBuddy -c "Add :CFBundleVersion string ${GITHUB_RUN_NUMBER}" "$APP/Contents/Info.plist"
          codesign --force --deep --sign - --timestamp=none "$APP"

          echo "architectures: $(lipo -archs "$BIN")"
          echo "min macOS: $(plutil -extract LSMinimumSystemVersion raw -o - "$APP/Contents/Info.plist" 2>/dev/null || echo unknown)"
          echo "bundle id: $(plutil -extract CFBundleIdentifier raw -o - "$APP/Contents/Info.plist")"
          echo "version: $(plutil -extract CFBundleShortVersionString raw -o - "$APP/Contents/Info.plist") ($(plutil -extract CFBundleVersion raw -o - "$APP/Contents/Info.plist"))"

          # The signature must be valid even though it is ad-hoc: an invalid one means a
          # broken bundle, which would fail on the user's Mac and never here.
          codesign --verify --deep --strict --verbose=2 "$APP" || {
            echo "::error::code signature is not valid"; exit 1; }
          codesign -dv --entitlements - "$APP" 2>&1 | head -20

          # Universal binary as built, so no arch suffix in the name.
          NAME="Mattermost-macOS-${TAG}"

          # Stage app + README as one folder so a single zip has both. The README must
          # live next to the bundle, never inside it: any file added under
          # Mattermost.app after signing invalidates the signature.
          STAGE="$RUNNER_TEMP/$NAME"
          mkdir -p "$STAGE"
          cp -R "$APP" "$STAGE/"
          cat > "$STAGE/README.txt" <<'README'
          Mattermost for Mac (Mac Catalyst build)
          ======================================

          The native Mac build of this repo's Mattermost client.

          INSTALL
            1. Unzip this archive.
            2. Drag Mattermost.app into /Applications, or run it from here.

          FIRST LAUNCH
          macOS will say it cannot check the app for malicious software. That is expected:
          this build is ad-hoc signed and not notarized, and notarization needs a paid
          Apple Developer account.

            Right-click Mattermost.app -> Open -> Open

          Or, in Terminal:

            xattr -dr com.apple.quarantine /Applications/Mattermost.app
            open /Applications/Mattermost.app

          NOTES
            - Universal: Apple Silicon and Intel (arm64 + x86_64).
            - Minimum macOS 14.0.
            - Enter your server URL on first run. Credentials go to the macOS Keychain.
            - Xcode Debug builds are unaffected; all of this applies only to this download.

          Source for this exact commit is in the same release's source archives.
          README

          # ditto, not zip: it preserves the code signature, extended attributes and
          # symlinks a .app depends on. `zip -r` mangles all three.
          ditto -c -k --sequesterRsrc --keepParent "$STAGE" "$RUNNER_TEMP/$NAME.zip"
          ls -lh "$RUNNER_TEMP/$NAME.zip"
          echo "contents:"
          unzip -l "$RUNNER_TEMP/$NAME.zip" | head -12

          {
            echo "ZIP=$RUNNER_TEMP/$NAME.zip"
            echo "NAME=$NAME"
          } >> "$GITHUB_ENV"

      - name: Attach to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          TAG=$(git describe --tags --exact-match HEAD 2>/dev/null || echo "")
          if [ -z "$TAG" ]; then
            # Belt and braces: the guard job skips this job on a superseded run, so this
            # only fires if the tag check and the guard ever disagree.
            echo "::error::HEAD $(git rev-parse --short=8 HEAD) carries no release tag, so the built zip has no release to attach to."
            exit 1
          fi
          echo "local zip: $ZIP ($(stat -f%z "$ZIP" 2>/dev/null || stat -c%s "$ZIP") bytes)"
          gh release upload "$TAG" "$ZIP" --clobber --repo "$REPO"
          echo "uploaded $NAME to $TAG"

      # Gap G3: nothing used to check the upload. `gh release view ... --jq .assets` was
      # printed and nothing compared it to anything, so a release with source archives
      # only, a 0-byte asset, or an asset of a different commit all passed. This step
      # fails the job instead of publishing a download nobody checked.
      - name: Verify the uploaded asset (gap G3)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG=$(git describe --tags --exact-match HEAD)
          SHA=$(git rev-parse HEAD)
          LOCAL_SIZE=$(stat -f%z "$ZIP" 2>/dev/null || stat -c%s "$ZIP")
          python3 scripts/verify_release_asset.py \
            --repo "${{ github.repository }}" \
            --tag "$TAG" \
            --sha "$SHA" \
            --asset "$NAME.zip" \
            --size "$LOCAL_SIZE"

      - name: Upload as artifact
        uses: actions/upload-artifact@v4
        with:
          name: mattermost-macos-app
          path: ${{ runner.temp }}/*.zip
          if-no-files-found: error

  # The one sentence a reader needs, on the run itself.
  #
  # Before this job existed a run that published nothing showed a red X on a test job and
  # two grey "skipped" boxes, and the reason lived in a log line somebody had to know to
  # look for. Every outcome now lands in the run summary and as an annotation on this job
  # (t_6904c92b): published, skipped (superseded / already published), refused, or blocked
  # (tests red, guard could not decide). It never changes the outcome - it explains it.
  verdict:
    name: verdict (why this run released or did not)
    needs: [guard, parity, test, release, package]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: State the outcome in one sentence
        env:
          GUARD: ${{ needs.guard.result }}
          PARITY: ${{ needs.parity.result }}
          TEST: ${{ needs.test.result }}
          RELEASE: ${{ needs.release.result }}
          PACKAGE: ${{ needs.package.result }}
          REASON: ${{ needs.release.outputs.reason }}
          TAG: ${{ needs.release.outputs.tag }}
          PUBLISHED: ${{ needs.release.outputs.published }}
        run: |
          set -euo pipefail
          SUMMARY="${GITHUB_STEP_SUMMARY:-/dev/null}"
          if [ "$GUARD" != "success" ]; then
            LINE="BLOCKED: the guard could not decide ($GUARD) - nothing ran. See the guard job's annotation."
            echo "::error::$LINE"
          elif [ "$REASON" = "already-published" ]; then
            # Checked BEFORE the published=true branch on purpose: the release job still
            # exports published=true on this path (the release exists, so the package job
            # may refresh its asset), and without this order the run page said PUBLISHED
            # for a re-run that cut nothing (t_6904c92b).
            LINE="SKIP: this commit already has its release ${TAG:-} - a re-run or a duplicate delivery never cuts a second one. Nothing was published."
            echo "::notice::$LINE"
          elif [ "$REASON" = "published" ] || [ "$PUBLISHED" = "true" ]; then
            if [ "$PACKAGE" = "success" ]; then
              LINE="PUBLISHED ${TAG:-a release} - tag, generated notes and the signed Mattermost-macOS-${TAG}.zip asset are on the release (tests: $TEST)."
            else
              LINE="PUBLISHED ${TAG:-a release} WITHOUT the app asset (package: $PACKAGE) - read the package job before telling anyone to download it."
              echo "::warning::$LINE"
            fi
            echo "::notice::$LINE"
          elif [ "$REASON" = "superseded" ]; then
            LINE="SKIP: this push was superseded by a newer commit on main before it reached the release stage. Nothing was published; the tip run releases."
            echo "::notice::$LINE"
          elif [ "$TEST" = "failure" ]; then
            LINE="BLOCKED: the test gate is red on this push, so no tag and no release were cut. The test job's annotation names the failing test and says whether it asserted or hung (and blames the environment only on the two facts together: a hung test and refused WebKit services)."
            echo "::error::$LINE"
          elif [ "$TEST" = "cancelled" ]; then
            LINE="BLOCKED: the test gate was cancelled, so nothing was released."
            echo "::error::$LINE"
          elif [ "$RELEASE" = "failure" ]; then
            LINE="BLOCKED: the release stage failed - read its annotation; published=false, so the package job did not build anything."
            echo "::error::$LINE"
          elif [ "$RELEASE" = "skipped" ]; then
            LINE="SKIP: the release job did not run (guard said is_tip=false, or the docs-only policy and a red leg disagreed). tests=$TEST release=$RELEASE."
            echo "::warning::$LINE"
          else
            LINE="NO RELEASE: tests=$TEST release=$RELEASE package=$PACKAGE - read the job above that is not green."
            echo "::warning::$LINE"
          fi
          {
            echo ""
            echo "### verdict"
            echo ""
            echo "$LINE"
            echo ""
            echo "| job | result |"
            echo "|---|---|"
            echo "| parity record | $PARITY |"
            echo "| test legs | $TEST |"
            echo "| release (tag and publish) | $RELEASE |"
            echo "| package (Mattermost.app) | $PACKAGE |"
          } >> "$SUMMARY"
