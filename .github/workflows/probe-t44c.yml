name: probe (throwaway, t_6904c92b)

# Diagnostic only: runs the three passes the release gate runs, on both legs, before they
# land on main. Same xcodebuild flags, same scripts/test_verdict.sh, so a green probe means
# the gate will be green. Deleted before the final push; it is not part of the pipeline.

on:
  push:
    branches: [cd/t_6904c92b]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    name: probe (${{ matrix.leg }} / ${{ matrix.pass }})
    runs-on: macos-26
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        leg: [catalyst, ios-simulator]
        pass: [gate, timing, platform]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Toolchain and host
        run: |
          xcodebuild -version
          echo "cpus: $(sysctl -n hw.ncpu)"

      - name: Resolve packages
        run: xcodebuild -resolvePackageDependencies -project Mattermost.xcodeproj -scheme Mattermost

      - name: Pass
        run: |
          set -uo pipefail
          if [ "${{ matrix.leg }}" = "ios-simulator" ]; then
            DEST="id=$(python3 scripts/ci_simulator.py)"
            SIGN="CODE_SIGNING_ALLOWED=YES CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=-"
          else
            DEST="platform=macOS,variant=Mac Catalyst"
            SIGN="CODE_SIGNING_ALLOWED=NO"
          fi
          LOG="$RUNNER_TEMP/${{ matrix.pass }}-${{ matrix.leg }}.log"
          case "${{ matrix.pass }}" in
            gate)
              SCOPE="-skip-testing:MattermostUITests \
                -skip-testing:MattermostTests/T31HarvestCookieInstallTests \
                -skip-testing:MattermostTests/T35PasteTests \
                -skip-testing:MattermostTests/T46WebFallbackTests \
                -skip-testing:MattermostTests/T56SelectionTests \
                -skip-testing:MattermostTests/T44CCallsMediaTeardownQueueTests \
                -skip-testing:MattermostTests/T49LoggerConcurrencyTests" ;;
            timing)
              SCOPE="-only-testing:MattermostTests/T44CCallsMediaTeardownQueueTests \
                -only-testing:MattermostTests/T49LoggerConcurrencyTests" ;;
            platform)
              SCOPE="-only-testing:MattermostTests/T31HarvestCookieInstallTests \
                -only-testing:MattermostTests/T35PasteTests \
                -only-testing:MattermostTests/T46WebFallbackTests \
                -only-testing:MattermostTests/T56SelectionTests" ;;
          esac
          # shellcheck disable=SC2086
          xcodebuild test -project Mattermost.xcodeproj -scheme Mattermost \
            -destination "$DEST" -derivedDataPath "$RUNNER_TEMP/dd" \
            -test-timeouts-enabled YES -default-test-execution-time-allowance 300 \
            $SIGN $SCOPE > "$LOG" 2>&1
          RC=$?
          echo "xcodebuild exit: $RC"
          grep -E "^\*\* TEST|Executed [0-9]+ tests" "$LOG" | tail -3 || true
          sed -n '/^Failing tests:/,/^$/p' "$LOG" | head -12 || true
          if [ "${{ matrix.pass }}" = "platform" ]; then
            bash scripts/classify_platform_tests.sh "$LOG" || true
          else
            bash scripts/test_verdict.sh --log "$LOG" --leg "${{ matrix.leg }}" \
              --pass "${{ matrix.pass }}" || exit 1
          fi
          exit $RC

      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: probe-${{ matrix.leg }}-${{ matrix.pass }}
          path: ${{ runner.temp }}/${{ matrix.pass }}-${{ matrix.leg }}.log
          if-no-files-found: warn
